<div class="max-w-7xl mx-auto p-6 grid lg:grid-cols-3 gap-8">
  <!-- Cart Items -->
  <div class="lg:col-span-2 flex flex-col gap-6">
    @if (isLoading()) {
      <div class="space-y-6">
        @for (item of [1, 2, 3]; track item) {
          <div class="flex gap-6 p-5 rounded-2xl bg-white dark:bg-neutral-900 shadow animate-pulse">
            <div class="w-28 h-28 bg-gray-300 rounded-xl"></div>

            <div class="flex-1 space-y-4">
              <div class="h-5 bg-gray-300 rounded w-1/3"></div>

              <div class="h-4 bg-gray-300 rounded w-1/4"></div>

              <div class="h-4 bg-gray-300 rounded w-1/6"></div>
            </div>
          </div>
        }
      </div>
    } @else {
      @if (cartItems().length === 0) {
        <div class="flex flex-col items-center justify-center py-24 text-center">
          <div class="text-6xl mb-6">🛒</div>

          <h2 class="text-2xl font-semibold mb-2">Your cart is empty</h2>

          <p class="text-gray-500 mb-6">Looks like you haven't added anything yet</p>

          <button
            routerLink="/products"
            class="px-6 py-3 bg-[#D4AF37] rounded-xl hover:scale-105 transition font-semibold"
          >
            Continue Shopping
          </button>
        </div>
      } @else {
        @for (item of cartItems(); track item.id) {
          <app-cart-card [item]="item"></app-cart-card>
        }
      }
    }
  </div>

  <!-- Order Summary -->
  @if (isLoading()) {
    <div class="bg-white dark:bg-neutral-900 p-6 rounded-2xl shadow animate-pulse">
      <!-- Title -->
      <div class="h-6 bg-gray-300 dark:bg-neutral-700 rounded w-1/2 mb-6"></div>

      <!-- Subtotal -->
      <div class="flex justify-between mb-4">
        <div class="h-4 bg-gray-300 dark:bg-neutral-700 rounded w-24"></div>
        <div class="h-4 bg-gray-300 dark:bg-neutral-700 rounded w-16"></div>
      </div>

      <!-- Shipping -->
      <div class="flex justify-between mb-4">
        <div class="h-4 bg-gray-300 dark:bg-neutral-700 rounded w-24"></div>
        <div class="h-4 bg-gray-300 dark:bg-neutral-700 rounded w-16"></div>
      </div>

      <!-- Total -->
      <div class="flex justify-between mb-6">
        <div class="h-5 bg-gray-300 dark:bg-neutral-700 rounded w-20"></div>
        <div class="h-5 bg-gray-300 dark:bg-neutral-700 rounded w-20"></div>
      </div>

      <!-- Button -->
      <div class="h-12 bg-gray-300 dark:bg-neutral-700 rounded-xl"></div>
    </div>
  } @else {
    <app-order-summary></app-order-summary>
  }
</div>
