<div class="container py-5">
  <!-- FILTER BAR (Kept from HEAD) -->
  <div class="card p-4 mb-4 shadow-sm">
    <div class="row g-2 align-items-end">
      <div class="col-md-3">
        <label class="form-label">Search</label>
        <input type="text" class="form-control" [(ngModel)]="filters.search" (input)="applyFilters()" />
      </div>

      <div class="col-md-2">
        <label class="form-label">Category</label>
        <select class="form-select" [(ngModel)]="filters.category" (change)="applyFilters()">
          <option value="">All</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
      </div>

      <div class="col-md-2">
        <label class="form-label">Min</label>
        <input type="number" class="form-control" [(ngModel)]="filters.min" (input)="applyFilters()" />
      </div>

      <div class="col-md-2">
        <label class="form-label">Max</label>
        <input type="number" class="form-control" [(ngModel)]="filters.max" (input)="applyFilters()" />
      </div>

      <div class="col-md-2">
        <label class="form-label">Sort</label>
        <select class="form-select" [(ngModel)]="filters.sort" (change)="applyFilters()">
          <option value="">None</option>
          <option value="priceAsc">Price ↑</option>
          <option value="priceDesc">Price ↓</option>
          <option value="name">Name A-Z</option>
          <option value="newest">Newest</option>
        </select>
      </div>

      <div class="d-flex align-items-end w-100 text-nowrap">
        <button class="btn btn-secondary w-100" (click)="resetFilters()">Reset</button>
      </div>
    </div>
  </div>

  <!-- PRODUCTS (Integrated dev's component structure with HEAD's filtering) -->
  <div class="row g-4">
    @for (p of filteredProducts; track p.id) {
    <div class="col-md-4">
      <!-- Using the shared component from the dev branch -->
      <app-product-card [product]="p" (addToCart)="addToCart(p)"></app-product-card>
    </div>
    } @empty {
    <!-- Angular 17+ empty block is cleaner than ng-template #noData -->
    <div class="text-center mt-5">
      <h4>No products found 😢</h4>
    </div>
    }
  </div>
</div>
