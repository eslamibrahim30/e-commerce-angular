<div class="container py-5">

  <!-- Page Header -->
  <div class="zora-pl-header mb-5">
    <h2 class="page-title mb-1">Our Products</h2>
    <p class="page-sub">{{ filteredProducts.length }} products available</p>
  </div>

  <!-- Filters Card -->
  <div class="zora-card mb-5 zora-filters">
    <div class="row g-3 align-items-end">

      <!-- Search -->
      <div class="col-12 col-md-4">
        <label class="zora-filter-label">Search</label>
        <div class="zora-search-wrap">
          <i class="fas fa-search zora-search-icon"></i>
          <input
            class="form-control zora-input ps-5"
            placeholder="Search products..."
            [(ngModel)]="filters.search"
            (input)="applyFilters()"
          />
        </div>
      </div>

      <!-- Category -->
      <div class="col-6 col-md-2">
        <label class="zora-filter-label">Category</label>
        <select
          class="form-select zora-input"
          [(ngModel)]="filters.category"
          (change)="applyFilters()"
        >
          <option value="">All</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
      </div>

      <!-- Min Price -->
      <div class="col-6 col-md-2">
        <label class="zora-filter-label">Min Price ($)</label>
        <input
          type="number"
          class="form-control zora-input"
          placeholder="0"
          [(ngModel)]="filters.min"
          (input)="applyFilters()"
          min="0"
        />
      </div>

      <!-- Max Price -->
      <div class="col-6 col-md-2">
        <label class="zora-filter-label">Max Price ($)</label>
        <input
          type="number"
          class="form-control zora-input"
          placeholder="Any"
          [(ngModel)]="filters.max"
          (input)="applyFilters()"
          min="0"
        />
      </div>

      <!-- Sort -->
      <div class="col-6 col-md-2">
        <label class="zora-filter-label">Sort By</label>
        <select
          class="form-select zora-input"
          [(ngModel)]="filters.sort"
          (change)="applyFilters()"
        >
          <option value="">Default</option>
          <option value="priceAsc">Price ↑</option>
          <option value="priceDesc">Price ↓</option>
          <option value="name">Name A–Z</option>
          <option value="newest">Newest</option>
        </select>
      </div>

    </div>

    <!-- Active Filters + Reset -->
    <div
      *ngIf="filters.search || filters.category || filters.min !== null || filters.max !== null || filters.sort"
      class="mt-3 pt-3 d-flex align-items-center gap-2 flex-wrap"
      style="border-top: 1px solid var(--border-color);"
    >
      <span class="text-muted small me-1">Active filters:</span>

      <span *ngIf="filters.search" class="zora-filter-chip">
        "{{ filters.search }}"
        <button (click)="filters.search=''; applyFilters()">×</button>
      </span>
      <span *ngIf="filters.category" class="zora-filter-chip">
        {{ filters.category }}
        <button (click)="filters.category=''; applyFilters()">×</button>
      </span>
      <span *ngIf="filters.min !== null" class="zora-filter-chip">
        Min ${{ filters.min }}
        <button (click)="filters.min=null; applyFilters()">×</button>
      </span>
      <span *ngIf="filters.max !== null" class="zora-filter-chip">
        Max ${{ filters.max }}
        <button (click)="filters.max=null; applyFilters()">×</button>
      </span>

      <button
        class="btn btn-sm btn-outline-secondary ms-auto rounded-pill px-3"
        (click)="resetFilters()"
      >
        Reset All
      </button>
    </div>
  </div>

  <!-- Products Grid -->
  <div class="row g-4" *ngIf="filteredProducts.length > 0">
    <div
      class="col-6 col-md-4 col-lg-3"
      *ngFor="let p of filteredProducts; trackBy: trackById"
    >
      <app-product-card [product]="p" (addToCart)="addToCart(p)"></app-product-card>
    </div>
  </div>

  <!-- Empty State -->
  <div *ngIf="filteredProducts.length === 0" class="zora-empty-state">
    <div class="zora-empty-icon">
      <i class="fas fa-box-open"></i>
    </div>
    <h5 class="fw-bold mt-4 mb-2">No products found</h5>
    <p class="text-muted mb-4">Try adjusting your search or filter criteria.</p>
    <button class="btn btn-zora-gold px-4 rounded-pill" (click)="resetFilters()">
      Clear Filters
    </button>
  </div>

</div>

<style>
.zora-pl-header {
  border-left: 4px solid var(--zora-gold);
  padding-left: 1rem;
}

.zora-filters {
  padding: 1.5rem 2rem;
}

.zora-filter-label {
  display: block;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.zora-input {
  background: var(--bg-color) !important;
  border: 1.5px solid var(--border-color) !important;
  color: var(--text-main) !important;
  border-radius: 10px !important;
  font-size: 0.875rem !important;
  transition: border-color 0.2s, box-shadow 0.2s !important;
}
.zora-input:focus {
  border-color: var(--zora-teal) !important;
  box-shadow: 0 0 0 3px rgba(11,121,116,0.1) !important;
  outline: none !important;
}
.zora-input option {
  background: var(--card-bg);
  color: var(--text-main);
}

.zora-search-wrap { position: relative; }
.zora-search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 0.82rem;
  z-index: 2;
  pointer-events: none;
}

.zora-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: rgba(11,121,116,0.08);
  color: var(--zora-teal);
  border: 1px solid rgba(11,121,116,0.18);
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 500;
}
.zora-filter-chip button {
  background: none;
  border: none;
  padding: 0;
  color: var(--zora-teal);
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  opacity: 0.6;
  transition: opacity 0.2s;
}
.zora-filter-chip button:hover { opacity: 1; }

.zora-empty-state {
  text-align: center;
  padding: 5rem 1rem;
}
.zora-empty-icon {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: rgba(11,121,116,0.07);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto;
  font-size: 2rem;
  color: var(--zora-teal);
}
</style>
