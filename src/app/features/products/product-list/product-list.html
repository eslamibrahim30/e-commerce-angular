<div class="container mt-4">
  <h2 class="mb-4">All Products</h2>

  <div class="row g-4">
    @for (p of products(); track p.id) {
      <div class="col-md-4">

        <div class="card h-100 shadow-sm border-0">

          <img [src]="p.image" class="card-img-top" style="height:200px; object-fit:cover;" />

          <div class="card-body text-center">

            <h5>{{ p.name }}</h5>
            <p class="text-primary fw-bold">${{ p.price }}</p>

            <a [routerLink]="['/products', p.id]" class="btn btn-outline-dark btn-sm me-2">
              View
            </a>

            <button class="btn btn-primary btn-sm" (click)="addToCart(p)">
              Add to Cart
            </button>

          </div>

        </div>

      </div>
    }
  </div>
</div>
