<div class="bg-primary text-white text-center p-5 mb-5">
  <h1 class="fw-bold">Welcome to Our Store</h1>
  <p>Best deals. Best quality. Fast delivery.</p>
  <a routerLink="/products" class="btn btn-light mt-3">Shop Now</a>
</div>

<div class="container mb-5">
  <h4 class="mb-3">Categories</h4>
  <div class="d-flex gap-2 flex-wrap">
    @for (cat of categories(); track cat) {
      <button class="btn btn-outline-dark">
        {{ cat }}
      </button>
    }
  </div>
</div>

<div class="container">
  <h4 class="mb-4">Featured Products</h4>

  <div class="row g-4">
    @for (p of featuredProducts(); track p.id) {
      <div class="col-md-4">
        <app-product-card [product]="p" (addToCart)="addToCart(p)"></app-product-card>
      </div>
    }
  </div>
</div>

<app-zora-modal 
  [isOpen]="showModal" 
  title="Success" 
  confirmText="Go to Cart" 
  cancelText="Continue Shopping"
  (confirmed)="showModal = false" 
  (canceled)="showModal = false">
  <div class="text-center py-3">
    <i class="fas fa-check-circle text-success fa-3x mb-3"></i>
    <p>Product has been successfully added to your cart!</p>
  </div>
</app-zora-modal>
