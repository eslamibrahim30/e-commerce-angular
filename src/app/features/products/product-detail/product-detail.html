@if (product(); as product) {
  <div class="container mt-5">
    <div class="row">

      <div class="col-md-6">
        <img [src]="product.image" class="w-100 rounded shadow" />
      </div>

      <div class="col-md-6">
        <h2>{{ product.name }}</h2>

        <p class="text-muted">{{ product.description }}</p>

        <h3 class="text-primary">${{ product.price }}</h3>

        <p>
          Stock:
          <span class="fw-bold" [class.text-success]="product.stock > 0" [class.text-danger]="product.stock === 0">
            {{ product.stock > 0 ? 'Available' : 'Out of Stock' }}
          </span>
        </p>

        <div class="mb-4" style="max-width: 150px;">
          <app-zora-input 
            label="Quantity" 
            type="number" 
            [control]="qtyControl">
          </app-zora-input>
        </div>

        <button class="btn btn-zora-gold rounded-pill px-4" (click)="addToCart()" [disabled]="qtyControl.invalid">
          Add to Cart
        </button>
      </div>

    </div>
  </div>
}
