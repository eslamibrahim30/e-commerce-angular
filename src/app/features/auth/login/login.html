<div class="auth-container min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div class="zora-auth-card shadow-lg p-4 p-md-5">
    
    <!-- Header Section -->
    <div class="text-center mb-5">
      <div class="brand-icon-wrapper mb-3">
        <img src="zora-logo.png" alt="Zora" class="brand-logo">
      </div>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Elevate your experience with Zora</p>
    </div>

    <!-- Feedback Alerts -->
    <div class="zora-alert danger mb-4 animate__animated animate__fadeIn" *ngIf="error">
      <i class="fas fa-circle-exclamation me-2"></i> {{ error }}
    </div>
    <div class="zora-alert success mb-4 animate__animated animate__fadeIn" *ngIf="successMessage">
      <i class="fas fa-check-circle me-2"></i> {{ successMessage }}
    </div>

    <form #form="ngForm" (ngSubmit)="login()" novalidate class="zora-form">
      
      <!-- Email Component -->
      <div class="mb-4">
        <app-zora-input 
          label="Email Address" 
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="user@example.com"
          [isInvalid]="!!(emailRef.invalid && emailRef.touched)"
          #emailRef="ngModel"
          required
          email>
        </app-zora-input>
      </div>

      <!-- Password Section -->
      <div class="mb-2 position-relative">
        <app-zora-input 
          label="Password" 
          [type]="showPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          [isInvalid]="!!(passRef.invalid && passRef.touched)"
          #passRef="ngModel"
          required
          minlength="4">
        </app-zora-input>
        
        <!-- Custom Toggle Icon -->
        <button type="button" class="zora-icon-btn pass-toggle" (click)="togglePassword()">
          <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
        </button>
      </div>


      <!-- Main Action Button -->
      <button
        type="submit"
        class="zora-btn-primary w-100 py-3"
        [disabled]="form.invalid || loading"
      >
        <span *ngIf="!loading">Sign In</span>
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
      </button>

    </form>

    <div class="zora-divider my-4"><span>OR</span></div>
    
    <p class="text-center auth-footer">
      New to Zora? 
      <a routerLink="/register" class="zora-link fw-bold">Create Account</a>
    </p>
  </div>
</div>
