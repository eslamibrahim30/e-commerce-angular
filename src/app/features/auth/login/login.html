<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light py-4">
  <div class="card shadow-sm border-0 rounded-4 p-4" style="width: 100%; max-width: 440px;">

    <div class="text-center mb-4">
      <h2 class="fs-5 fw-semibold mb-1">Welcome back</h2>
      <p class="text-muted small">Sign in to your account</p>
    </div>

    <div class="alert alert-danger py-2 small" *ngIf="error">{{ error }}</div>
    <div class="alert alert-success py-2 small" *ngIf="successMessage">{{ successMessage }}</div>

    <form #form="ngForm" (ngSubmit)="login()" novalidate>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label small fw-medium text-secondary">Email address</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/>
            </svg>
          </span>
          <input
            type="email"
            class="form-control"
            name="email"
            [(ngModel)]="email"
            required
            email
            #emailRef="ngModel"
            placeholder="Enter your email"
            [class.is-invalid]="emailRef.invalid && emailRef.touched"
            [class.is-valid]="emailRef.valid && emailRef.touched"
          />
          <div class="invalid-feedback">Please enter a valid email address.</div>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-1">
        <label class="form-label small fw-medium text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="form-control"
            name="password"
            [(ngModel)]="password"
            required
            minlength="4"
            #passRef="ngModel"
            placeholder="Enter your password"
            [class.is-invalid]="passRef.invalid && passRef.touched"
            [class.is-valid]="passRef.valid && passRef.touched"
          />
          <button class="btn btn-outline-secondary" type="button" (click)="togglePassword()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <ng-container *ngIf="!showPassword">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </ng-container>
              <ng-container *ngIf="showPassword">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </ng-container>
            </svg>
          </button>
          <div class="invalid-feedback">Password must be at least 4 characters.</div>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="text-end mb-4 mt-1">
        <a routerLink="/forgot-password" class="small text-decoration-none" style="color: #7F77DD; font-weight: 500;">
          Forgot password?
        </a>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-primary w-100 py-2 fw-medium"
        [disabled]="form.invalid || loading"
      >
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>

    </form>

    <div class="text-center my-3 text-muted small">─────── or ───────</div>
    <p class="text-center small text-muted mb-0">
      Don't have an account?
      <a routerLink="/register" class="text-decoration-none fw-medium" style="color: #7F77DD;">Create one</a>
    </p>

  </div>
</div>
