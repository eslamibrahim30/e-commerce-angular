<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light py-4">
  <div class="profile-card" *ngIf="user">

    <!-- Header Band -->
    <div class="card-header-band">
      <div class="avatar mx-auto">{{ getInitials(user.name) }}</div>
      <p class="user-name">{{ user.name }}</p>
      <div class="text-center">
        <span class="role-badge">{{ user.role }}</span>
      </div>
    </div>

    <!-- Body -->
    <div class="card-body-pad">

      <div class="alert-success-custom mb-3" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <!-- Full Name -->
      <div class="mb-3">
        <label class="form-label small fw-medium text-secondary">Full name</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
            </svg>
          </span>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="user.name"
            placeholder="Enter your name"
          />
        </div>
      </div>

      <!-- Email (read-only) -->
      <div class="mb-4">
        <label class="form-label small fw-medium text-secondary">
          Email address
          <span class="badge ms-1 read-only-badge">Read only</span>
        </label>
        <div class="input-group">
          <span class="input-group-text">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/>
            </svg>
          </span>
          <input type="email" class="form-control" [value]="user.email" disabled />
        </div>
      </div>

      <hr class="my-3">

      <!-- Meta Info -->
      <div class="d-flex justify-content-between align-items-center small mb-1">
        <span class="text-muted">Account role</span>
        <span class="fw-medium text-capitalize">{{ user.role }}</span>
      </div>
      <div class="d-flex justify-content-between align-items-center small mb-4">
        <span class="text-muted">Member since</span>
        <span class="fw-medium">{{ memberSince }}</span>
      </div>

      <!-- Save Button -->
      <button
        class="btn btn-primary w-100 py-2 fw-medium"
        (click)="update()"
        [disabled]="loading"
      >
        {{ loading ? 'Saving...' : 'Save changes' }}
      </button>

    </div>
  </div>
</div>
