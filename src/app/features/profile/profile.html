<div class="auth-container d-flex align-items-center justify-content-center py-5">
  @if (user) {
  <div class="zora-auth-card profile-card-layout overflow-hidden">

    <!-- Header Band (Zora Style) -->
    <div class="profile-header-band text-center">
      <div class="avatar-wrapper mx-auto">
        <div class="avatar-circle">{{ getInitials(user.name) }}</div>
      </div>
      <h2 class="auth-title mt-3 mb-1">{{ user.name }}</h2>
      <span class="zora-role-badge">{{ user.role }}</span>
    </div>

    <!-- Body Content -->
    <div class="p-4 p-md-5 pt-0">

      @if (successMessage()) {
      <div class="zora-alert success mb-4 animate__animated animate__fadeIn">
        <i class="fas fa-check-circle me-2"></i> {{ successMessage() }}
      </div>
      }

      <!-- Full Name Input -->
      <div class="mb-4">
        <label class="form-label small fw-bold text-dark">Full name</label>
        <div class="input-group zora-input-group">
          <span class="input-group-text"><i class="fas fa-user"></i></span>
          <input type="text" class="form-control" [(ngModel)]="user.name" placeholder="Edit your name" />
        </div>
      </div>

      <!-- Email (Read-only Style) -->
      <div class="mb-4">
        <div class="d-flex justify-content-between">
          <label class="form-label small fw-bold text-dark">Email address</label>
          <span class="badge zora-read-only-tag">Read only</span>
        </div>
        <div class="input-group zora-input-group disabled-group">
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control" [value]="user.email" disabled />
        </div>
      </div>

      <div class="zora-divider my-4"></div>

      <!-- Meta Info Grid -->
      <div class="user-meta-info mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="text-muted small fw-medium">Account Role</span>
          <span class="text-capitalize badge-soft-teal">{{ user.role }}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="text-muted small fw-medium">Member Since</span>
          <span class="fw-bold text-dark small">{{ memberSince }}</span>
        </div>
      </div>

      <!-- Save Button -->
      <button class="zora-btn-primary w-100 py-3" (click)="update()" [disabled]="loading()">
        @if (!loading()) {
          <span>Save Changes</span>
        }

        @if (loading()) {
          <span>
            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            Updating...
          </span>
        }
      </button>

      @if (successMessage()) {
      <div class="alert alert-success mt-3 py-2 border-0 shadow-sm text-center">
        <i class="fa-solid fa-check-circle me-2"></i> {{ successMessage() }}
      </div>
      }

    </div>
  </div>
  }
</div>
