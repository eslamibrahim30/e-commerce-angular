<!-- Mobile Navbar (Bootstrap Collapse) -->
<nav class="navbar navbar-expand-lg fixed-top border-bottom shadow-sm d-lg-none px-3 py-2" style="background: var(--card-bg); z-index: 1040;">
  <a class="navbar-brand d-flex align-items-center gap-2" routerLink="/admin/dashboard">
    <img src="zora-logo.png" alt="Zora Logo" height="36" class="object-fit-contain">
    <span class="badge" style="background: var(--zora-primary); color: #fff; font-size: 10px; border-radius: 20px; padding: 3px 8px;">Admin</span>
  </a>
  <button class="navbar-toggler border-0 shadow-none px-1" type="button" data-toggle="collapse" data-target="#adminMobileMenu" aria-controls="adminMobileMenu" aria-expanded="false" aria-label="Toggle navigation">
    <i class="fa-solid fa-bars-staggered fs-4" style="color: var(--zora-primary);"></i>
  </button>

  <div class="collapse navbar-collapse mt-3 pb-2" id="adminMobileMenu">
    <ul class="navbar-nav w-100 gap-1">
      @for (item of menuItems; track item.path) {
        <li class="nav-item">
          <a class="nav-link-modern mb-1" 
             [routerLink]="item.path" 
             routerLinkActive="active"
             [routerLinkActiveOptions]="{exact: item.path === '/admin/dashboard'}"
             data-toggle="collapse" data-target="#adminMobileMenu">
            <span class="icon-box" [innerHTML]="item.svg"></span>
            <span class="label-text">{{ item.label }}</span>
          </a>
        </li>
      }
    </ul>
    
    <hr class="my-3 text-muted opacity-25">
    
    <div class="d-flex align-items-center gap-3 px-3">
       <div class="user-avatar-text rounded-3 size-40 d-flex align-items-center justify-content-center fw-bold fs-5" style="width: 40px; height: 40px;">Z</div>
       <div>
         <div class="fw-bold small mb-0" style="color: var(--text-main);">Zora Team</div>
         <div style="font-size: 11px; color: var(--text-muted);">Admin</div>
       </div>
       <button class="logout-minimal ms-auto" (click)="logout()" data-toggle="collapse" data-target="#adminMobileMenu">
         <i class="fa-solid fa-arrow-right-from-bracket"></i>
       </button>
    </div>
  </div>
</nav>

<!-- Desktop Sidebar (Hidden on mobile) -->
<aside class="zora-modern-sidebar d-none d-lg-flex">
  <!-- Header: Minimal & Brand Focused -->
  <div class="sidebar-brand">
    <div class="brand-container">
      <div class="logo-wrapper">
        <img src="zora-logo.png" alt="Zora Logo" class="brand-img">
        <span class="badge-admin">Admin</span>
      </div>
    </div>
  </div>

  <!-- Navigation: Floating Items -->
  <nav class="sidebar-content">
    <div class="nav-group">
      <label class="group-title">Main Navigation</label>
      <ul class="modern-nav">
        @for (item of menuItems; track item.path) {
          <li class="nav-item">
            <a class="nav-link-modern" 
               [routerLink]="item.path" 
               routerLinkActive="active"
               [routerLinkActiveOptions]="{exact: item.path === '/admin/dashboard'}">
              <span class="icon-box" [innerHTML]="item.svg"></span>
              <span class="label-text">{{ item.label }}</span>
              <div class="active-indicator"></div>
            </a>
          </li>
        }
      </ul>
    </div>
  </nav>

  <!-- Profile Card: Integrated Design -->
  <div class="sidebar-user-card">
    <div class="user-profile">
      <div class="user-avatar">
        <div class="user-avatar-text">Z</div>
        <div class="status-dot"></div>
      </div>
      <div class="user-details">
        <p class="user-name">Zora Team</p>
        <p class="user-role">Admin</p>
      </div>
      <button class="logout-minimal" (click)="logout()" title="Sign Out">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </div>
</aside>
