<!-- Mobile Toggle Button -->
<button class="btn mobile-toggle d-lg-none" (click)="toggleSidebar()">
  <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="12" x2="21" y2="12"></line>
    <line x1="3" y1="6" x2="21" y2="6"></line>
    <line x1="3" y1="18" x2="21" y2="18"></line>
  </svg>
</button>

<!-- Overlay for Mobile -->
<div class="sidebar-overlay d-lg-none" *ngIf="isOpen()" (click)="closeSidebar()"></div>

<aside class="zora-sidebar shadow-sm" [class.open]="isOpen()">
  <div class="sidebar-header px-4 py-4 mb-4">
    <div class="d-flex align-items-center gap-3">
      <div class="logo-box d-flex align-items-center justify-content-center" style="width: 42px; height: 42px;">
        <img src="zora-logo.png" alt="Zora Logo" style="width: 100%; height: 100%; object-fit: contain;">
      </div>
      <div>
        <h5 class="fw-black text-main mb-0 tracking-tight">Zora <span class="text-primary opacity-75">Admin</span></h5>
        <span class="text-muted small fw-bold opacity-50">CONTROL PANEL</span>
      </div>
      <button
        class="btn btn-sm btn-light border-0 shadow-sm rounded-circle d-flex align-items-center justify-content-center"
        style="width: 32px; height: 32px; flex-shrink: 0;" (click)="toggleTheme()"
        [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'">
        <svg *ngIf="!themeService.isDarkMode()" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg *ngIf="themeService.isDarkMode()" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>
    </div>
  </div>

  <nav class="sidebar-nav px-3 flex-grow-1">
    <div class="nav-section mb-4">
      <span
        class="section-label px-3 mb-3 d-block text-muted small fw-black tracking-widest opacity-50">MANAGEMENT</span>

      <ul class="nav flex-column gap-1">
        <li class="nav-item" *ngFor="let item of menuItems">
          <a class="nav-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 transition-all"
            [routerLink]="item.path" routerLinkActive="active shadow-sm"
            [routerLinkActiveOptions]="{exact: item.path === '/admin/dashboard'}">
            <span class="nav-icon d-flex align-items-center justify-content-center" [innerHTML]="item.svg"></span>
            <span class="nav-label fw-bold">{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="nav-section mt-auto mb-4 border-top pt-4">
      <span class="section-label px-3 mb-3 d-block text-muted small fw-black tracking-widest opacity-50">ACCOUNT</span>

      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-3 px-3 py-2 rounded-3 transition-all text-danger"
            href="javascript:void(0)" (click)="logout()">
            <span class="nav-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
            </span>
            <span class="nav-label fw-bold">Sign Out</span>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div class="sidebar-footer px-4 py-3 border-top bg-light bg-opacity-50 mt-auto">
    <div class="d-flex align-items-center gap-3">
      <div
        class="avatar bg-white border rounded-circle shadow-sm d-flex align-items-center justify-content-center fw-bold text-primary"
        style="width: 32px; height: 32px;">
        A
      </div>
      <div class="overflow-hidden">
        <div class="fw-bold text-main text-truncate" style="font-size: 13px;">Admin User</div>
        <div class="text-muted small text-truncate" style="font-size: 11px;">admin@zora.io</div>
      </div>
    </div>
  </div>
</aside>
