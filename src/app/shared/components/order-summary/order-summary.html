<div class="bg-white dark:bg-neutral-900 p-6 rounded-2xl shadow h-fit sticky top-24">

  <h2 class="text-xl font-bold mb-4">Order Summary</h2>

  <div class="space-y-3 text-sm">
    <div class="flex justify-between">
      <span>Items</span>
      <span>{{ cartItems().length }}</span>
    </div>

    <div class="flex justify-between">
      <span>Subtotal</span>
      <span>${{ subtotal() }}</span>
    </div>

    <div class="flex justify-between">
      <span>Shipping</span>
      <span>Free</span>
    </div>

    <hr class="my-3 border-gray-200 dark:border-neutral-700"/>

    <div class="flex justify-between text-lg font-bold">
      <span>Total</span>
      <span>${{ subtotal() }}</span>
    </div>
  </div>

  <button class="w-full mt-6 py-3 rounded-xl bg-[#D4AF37] font-semibold hover:scale-105 transition">
    Place Order
  </button>

</div>
