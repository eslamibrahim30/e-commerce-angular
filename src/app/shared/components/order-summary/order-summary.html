<div class="bg-white p-4 rounded-4 shadow position-sticky" style="top: 100px">
  <h2 class="h5 fw-bold mb-3">Order Summary</h2>

  <div class="small">
    <div class="d-flex justify-content-between mb-2">
      <span>Items</span>
      <span>{{ cartItems().totalQuantity }}</span>
    </div>

    <div class="d-flex justify-content-between mb-2">
      <span>Subtotal</span>
      <span>${{ cartItems().totalPrice.toFixed(2) }}</span>
    </div>

    <div class="d-flex justify-content-between mb-2">
      <span>Shipping</span>
      <span>Free</span>
    </div>

    <hr class="my-3" />

    <div class="d-flex justify-content-between fw-bold fs-5">
      <span>Total</span>
      <span>${{ cartItems().totalPrice.toFixed(2) }}</span>
    </div>
  </div>

  <button
    class="btn btn-warning w-100 mt-4 fw-semibold d-flex justify-content-center align-items-center gap-2"
    (click)="handleOrder()"
    [disabled]="loading"
  >
    @if (!loading) {
      <span><i class="fa-solid fa-cart-shopping"></i>{{ isCartRoute ? 'Go to Checkout' : 'Place Order' }}</span>
    }

    @if (loading) {
      <span class="spinner-border spinner-border-sm"></span>
    }
  </button>
</div>
