@if (showToast) {
  <div class="toast-container position-fixed top-0 end-0 p-3">
    <div class="toast show align-items-center text-bg-danger border-0">
      <div class="d-flex">
        <div class="toast-body">
          {{ toastMessage }}
        </div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          (click)="showToast = false"
        ></button>
      </div>
    </div>
  </div>
}
<div class="bg-white p-4 rounded-4 shadow position-sticky" style="top: 100px">
  <h2 class="h5 fw-bold mb-3">Order Summary</h2>

  <div class="small">
    <div class="d-flex justify-content-between mb-2">
      <span>Items</span>
      <span>{{ cartItems().totalQuantity }}</span>
    </div>

    <div class="d-flex justify-content-between mb-2">
      <span>Subtotal</span>
      <span>${{ cartItems().totalPrice.toFixed(2) }}</span>
    </div>

    <div class="d-flex justify-content-between mb-2">
      <span>Shipping</span>
      <span>Free</span>
    </div>

    <hr class="my-3" />

    <div class="d-flex justify-content-between fw-bold fs-5">
      <span>Total</span>
      <span>${{ cartItems().totalPrice.toFixed(2) }}</span>
    </div>
  </div>

  <button
    class="btn btn-warning w-100 mt-4 fw-semibold d-flex justify-content-center align-items-center gap-2"
    (click)="handleOrder()"
    [disabled]="loading || isCartEmpty()"
  >
    @if (!loading) {
      @if (isCheckoutPage()) {
        <span><i class="fa-solid fa-cart-shopping"></i> Place Order</span>
      } @else {
        <span><i class="fa-solid fa-credit-card"></i> Checkout</span>
      }
    }

    @if (loading) {
      <span class="spinner-border spinner-border-sm"></span>
    }
  </button>
</div>
