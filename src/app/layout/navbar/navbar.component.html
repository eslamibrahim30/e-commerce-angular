<nav class="premium-navbar">
  <div class="navbar-container">
    <a routerLink="/" class="brand-logo">
      <div class="logo-icon">
        <i class="fa-solid fa-gem"></i>
      </div>
      <span class="brand-text">Zora</span>
    </a>

    <button class="mobile-toggle" (click)="toggleMenu()">
      <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
    </button>

    <div class="nav-menu" [class.active]="isMenuOpen">
      <ul class="nav-links">
        <li>
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">
            <span class="link-text">Home</span>
            <div class="link-indicator"></div>
          </a>
        </li>
        <li>
          <a routerLink="/products" routerLinkActive="active" class="nav-link">
            <span class="link-text">Shop</span>
            <div class="link-indicator"></div>
          </a>
        </li>
      </ul>

      <div class="nav-actions">
        <div class="search-wrapper">
          <div class="search-box">
            <input type="text" placeholder="Search premium items..." class="search-input">
            <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
          </div>
        </div>

        <a routerLink="/cart" class="action-btn cart-btn">
          <i class="fa-solid fa-bag-shopping"></i>
          <span class="badge">{{ cartService.totalQuantity() }}</span>
        </a>

        <a routerLink="/login" class="action-btn user-btn">
          <i class="fa-regular fa-user"></i>
        </a>
      </div>
    </div>
  </div>
</nav>
