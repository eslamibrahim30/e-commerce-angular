<nav class="navbar navbar-expand-lg premium-navbar sticky-top">
  <div class="container navbar-container">
    <a routerLink="/" class="navbar-brand brand-logo" (click)="closeMenu()">
      <div class="logo-wrapper">
        <img src="zora-logo.png" alt="Zora Logo" class="main-logo">
      </div>
    </a>

    <button class="navbar-toggler mobile-toggle" type="button" (click)="toggleMenu()" aria-controls="zoraNavbar"
      [aria-expanded]="isMenuOpen" aria-label="Toggle navigation">
      <i class="fa-solid" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen"></i>
    </button>

    <div class="collapse navbar-collapse" id="zoraNavbar" [class.show]="isMenuOpen">
      <ul class="navbar-nav mx-auto nav-links">
        <li class="nav-item">
          <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link"
            (click)="closeMenu()">
            <span class="link-text">Home</span>
            <div class="link-indicator"></div>
          </a>
        </li>
        <li class="nav-item">
          <a routerLink="/products" routerLinkActive="active" class="nav-link" (click)="closeMenu()">
            <span class="link-text">Shop</span>
            <div class="link-indicator"></div>
          </a>
        </li>
      </ul>

      <div class="nav-actions-wrapper">
        <div class="search-box">
          <input type="text" placeholder="Search products..." class="search-input">
          <button class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="action-group">
          <a routerLink="/cart" class="action-btn cart-btn" (click)="closeMenu()">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="badge">{{ cartService.totalQuantity() }}</span>
          </a>
          <a routerLink="/login" class="action-btn user-btn" (click)="closeMenu()">
            <i class="fa-regular fa-user"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>
